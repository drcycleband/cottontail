<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Set up your passkey · Cottontail</title>
  <script defer src="/webauthn-browser.js"></script>
  <script defer src="/passkey-client.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f2eb;color:#294333;font:17px system-ui,sans-serif;padding:24px}main{width:100%;max-width:440px;background:white;padding:28px;border-radius:22px}h1{font-size:28px}p{line-height:1.5}label{display:block;font-weight:600;margin:20px 0 8px}input,button{font:inherit;width:100%;padding:14px;border-radius:9px}input{border:1px solid #a8b4aa}button{border:0;background:#345a40;color:white;font-weight:700;margin-top:24px;cursor:pointer}a{color:#345a40}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #c39149;outline-offset:3px}
  </style>
</head>
<body><main>
  <h1>Set up your passkey</h1>
  <p>Use your own iPhone or Mac. Enter the editor password, then approve Face ID, Touch ID, or your device passcode. Save the passkey in your own Apple Passwords account.</p>
  <form id="passkey-enroll">
    <label for="setup-password">Editor password</label>
    <input id="setup-password" type="password" autocomplete="current-password" required maxlength="1000">
    <button type="submit">Create my passkey</button>
  </form>
  <p id="passkey-message" role="status"></p>
  <a href="/login">Go to sign in</a>
</main></body>
</html>
