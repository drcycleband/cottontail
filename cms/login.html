<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Cottontail Website Editor</title>
  <script defer src="/webauthn-browser.js"></script>
  <script defer src="/passkey-client.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f2eb;color:#294333;font-family:system-ui,sans-serif;padding:24px}main{width:100%;max-width:420px;background:white;padding:36px;border-radius:22px;box-shadow:0 12px 45px #29433312}h1{font-size:28px;margin:8px 0}p{line-height:1.5;color:#59675d}.brand{font-size:13px;letter-spacing:2px;text-transform:uppercase}label{display:block;font-weight:600;margin:22px 0 8px}input,button{font:inherit;width:100%;padding:13px;border-radius:9px}input{border:1px solid #a8b4aa}button{border:0;background:#345a40;color:white;font-weight:700;margin-top:26px;cursor:pointer}input:focus-visible,button:focus-visible{outline:3px solid #c39149;outline-offset:3px}.error{color:#a32727}
  </style>
</head>
<body><main>
  <div class="brand">Cottontail Childcare</div>
  <h1>Welcome back</h1>
  <p>Sign in to edit your website.</p>
  <p id="error" class="error" role="alert" hidden>That username or password wasn’t correct. Please try again.</p>
  <button id="passkey-login" type="button" hidden>Sign in with a passkey</button>
  <p id="passkey-message" role="status"></p>
  <form id="password-login" action="/auth/login" method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus maxlength="200">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1000">
    <button type="submit">Sign in</button>
  </form>
  <script>document.getElementById('error').hidden = !new URLSearchParams(location.search).has('error');</script>
</main></body>
</html>
