<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cottontail Gallery Editor</title>
    <link rel="stylesheet" href="admin.css" />
    <script defer src="admin.js"></script>
  </head>
  <body>
    <header class="admin-header">
      <div>
        <p class="eyebrow">Cottontail CMS</p>
        <h1>Gallery Editor</h1>
        <p class="header-note">Add, replace, remove, and reorder gallery photos. Everything else on the website stays locked.</p>
      </div>
      <a href="/" target="_blank" rel="noreferrer">View Site</a>
    </header>

    <main>
      <section class="status-panel" aria-live="polite">
        <span id="status">Loading content...</span>
        <div class="status-actions">
          <button type="button" id="save-button">Save Draft</button>
          <button type="button" id="publish-button" class="publish">Publish Website</button>
        </div>
      </section>

      <section class="gallery-panel priority-panel">
        <div class="gallery-panel-heading">
          <div>
            <h2>Gallery Photos</h2>
            <p>Add new photos at the top. Use Move Up and Move Down to change the order.</p>
          </div>
        </div>
        <div id="gallery-fields" class="gallery-list"></div>
      </section>
    </main>
  </body>
</html>
