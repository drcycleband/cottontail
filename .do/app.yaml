name: cottontail-childcare
static_sites:
  - name: cottontail-web
    github:
      repo: drcycleband/cottontail
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: bash build-static.sh
    output_dir: /public_site
    routes:
      - path: /
    catchall_document: index.html
    error_document: index.html
